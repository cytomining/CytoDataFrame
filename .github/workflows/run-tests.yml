---
# used for running tests
name: tests

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pre_commit_checks:
    runs-on: ubuntu-24.04
    # we avoid running duplicative
    # pre-commit checks for dependabot PRs
    if: github.actor != 'dependabot[bot]'
    steps:
      # checks out the repo
      - uses: actions/checkout@v6
      - name: Python setup
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v7
      # run pre-commit
      - uses: pre-commit/action@v3.0.1
        id: pre_commit
      # run pre-commit ci lite for automated fixes
      - uses: pre-commit-ci/lite-action@v1.1.0
        if: ${{ !cancelled() && steps.pre_commit.outcome == 'failure' }}
  run_tests:
    strategy:
      matrix:
        python_version: ["3.11", "3.12", "3.13"]
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    env:
      OS: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Python setup
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python_version }}
      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v7
      - name: Run pytest (non-3.13)
        if: ${{ matrix.python_version != '3.13' }}
        # run all tests
        run: uv run --frozen pytest -o addopts=
      - name: Run pytest (py 3.13)
        if: ${{ matrix.python_version == '3.13' }}
        # run all tests except integration tests with cosmicqc
        run: |
          uv run --frozen pytest -o addopts= \
            --ignore=tests/test_project_integration.py
