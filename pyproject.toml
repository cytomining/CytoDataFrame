[build-system]
build-backend = "setuptools.build_meta"
requires = [ "setuptools>=77", "setuptools-scm>=8" ]

[project]
name = "cytodataframe"
description = """\
  An in-memory data analysis format for single-cell profiles alongside their corresponding images and segmentation \
  masks.\
  """
readme = "README.md"
license = "BSD-3-Clause"
authors = [ { name = "Way Science Community" } ]
requires-python = ">=3.11,<3.14"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dynamic = [ "version" ]
dependencies = [
  "imagecodecs>=2024.9.22,<2027",
  "imageio>=2.37,<3",
  "ipython>=8.12.3,<10",
  "ipyvolume>=0.6.3,<0.7",
  "ipywidgets>=8.1.7,<9",
  "matplotlib>=3.9.3,<4",
  "nest-asyncio2>=1.7,<2",
  "ome-arrow>=0.0.3,<0.1.1",
  "opencv-python>=4.10.0.84,<6",
  "pandas>=2.2.2,<4",
  "pyarrow>=16",
  "pyvista>=0.46.4",
  "pywavelets>1.4.1",
  "scikit-image>0.19.3",
  # tifffile+zarr enable a lazy, windowed read of a per-object 3D bounding
  # box (see `_try_lazy_windowed_tiff_crop`): only the object's own
  # z-planes/window are read from a plain TIFF z-stack, instead of decoding
  # the whole (often hundreds-of-MB) volume just to crop it down afterward.
  # Without these, 3D volumes still load correctly via the existing eager
  # `imageio` read -- just slower for large field-of-view TIFFs. tifffile
  # dropped Zarr 2 support for its zarr-store integration in 2025.5.21 (an
  # older zarr paired with a newer tifffile breaks the lazy path entirely,
  # rather than just falling back to the eager read), and 2026.4.11 was its
  # last release still supporting Python 3.11 (required below); a later
  # tifffile also starts requiring zarr>=3.2.0, which itself needs
  # Python>=3.12, so staying under that keeps 3.11 support intact.
  "tifffile>=2025.5.21,<2026.4.11",
  "trame>=3.12",
  "trame-vtk>=2.10",
  "trame-vuetify>=3.1",
  "zarr>=3",
]

[dependency-groups]
dev = [
  "black>=24.10,<27",
  "cosmicqc>=1.0.1; python_version<'3.13' and python_version>='3.10'",
  "coverage>=7.6,<8",
  "duckdb>=1.1.3,<2",
  "httpcore>=0.18,<1.1",
  "isort>=5.13.2,<10",
  "jupyterlab>=4.3,<5",
  "jupyterlab-code-formatter>=3.0.2,<4",
  "jupytext>=1.16.4,<2",
  "poethepoet>=0.37,<0.49",
  "pytest>=8.3.3,<10",
  "pytest-cov>=5,<8",
  # Pinned to match .pre-commit-config.yaml's ruff-pre-commit rev. ruff was
  # not previously a declared project dependency at all, so `uv run ruff`
  # silently fell through to an unrelated, unpinned `ruff` found elsewhere
  # on PATH (a pyenv shim, in practice) -- giving different lint results
  # locally than prek/CI's pinned hook used, depending on which one you ran.
  "ruff==0.16.5",
  "sqlalchemy>=1.3.6,<3",
]
docs = [
  "dunamai>=1.22,<2",
  "myst-nb>=1.1.2,<2",
  "myst-parser>=3,<6",
  "pydata-sphinx-theme>=0.16,<0.22",
  "sphinx>=9,<9.1",
  "sphinx-multiversion",
]

[tool.setuptools]
packages.find.where = [ "src" ]
package-dir = { "" = "src" }

[tool.setuptools_scm]
version_file = "src/cytodataframe/_version.py"
version_scheme = "no-guess-dev"
local_scheme = "no-local-version"
root = "."

[tool.uv]
default-groups = [
  "dev",
  "docs",
]
sources.sphinx-multiversion = { git = "https://github.com/J-RN/sphinx-multiversion", rev = "a77f0c862dace3a62c18fc866da60ef7dde3873d" }

[tool.ruff]
target-version = "py311"
line-length = 88
fix = true
lint.select = [
  # flake8-builtins
  "A",
  # flake8-annotations
  "ANN",
  # flake8-comprehensions
  "C4",
  # mccabe
  "C90",
  # pycodestyle
  "E",
  # pyflakes
  "F",
  # isort
  "I",
  # pylint
  "PL",
  # ruff
  "RUF",
  # flake8-simplify
  "SIM",
  "W",
]
# Ignore `E402` and `F401` (unused imports) in all `__init__.py` files
lint.per-file-ignores."__init__.py" = [ "E402", "F401" ]
lint.per-file-ignores."docs/src/examples/*.py" = [ "E402", "E501" ]
lint.per-file-ignores."src/cytodataframe/*.py" = [ "ANN401", "PLC0415" ]
lint.per-file-ignores."src/cytodataframe/image.py" = [ "PLR2004" ]
# ignore typing rules for tests
lint.per-file-ignores."tests/*" = [ "ANN201", "PLR0913", "PLR0917", "PLR2004", "SIM105" ]

# specify where version replacement is performed
[tool.bandit]
exclude_dirs = [ "tests" ]

[tool.pytest]
ini_options.addopts = "--cov=src/cytodataframe --cov-report=term-missing:skip-covered --no-cov-on-fail"

[tool.coverage]
# settings to avoid errors with cv2 and coverage
# see here for more: https://github.com/nedbat/coveragepy/issues/1653
run.omit = [
  # imagecodecs' compiled extensions carry Cython line-trace data pointing at
  # ``.pyx`` sources that aren't shipped, which breaks ``coverage xml`` once
  # tests decode JPEG XL.
  "*.pyx",
  "config-3.py",
  "config.py",
]

[tool.jupytext]
formats = "ipynb,py:light"

[tool.poe]
# note: quarto commands below expect quarto installed on the local system.
# see here for more information: https://quarto.org/docs/download/
tasks.poster-preview.shell = """
quarto preview \
  docs/presentations/2025-sbi2/poster.qmd
"""
tasks.poster-render.shell = """\
  quarto render \\\n  docs/presentations/2025-sbi2/poster.qmd\n  mv \
  docs/presentations/2025-sbi2/cytodataframe-2025-poster.pdf \\\n  docs/src/_static/cytodataframe-2025-poster.pdf\n\
  """
